<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Sandbox Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 800px;
      height: 600px;
      background: #87CEEB;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }
    #blockSelector {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
    }
    .block-option {
      width: 50px;
      height: 50px;
      border: 3px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .block-option:hover { transform: scale(1.1); }
    .block-option.selected { border-color: white; transform: scale(1.15); }
    #instructions {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
      <div>Blocks: <span id="blockCount">0</span></div>
      <div>FPS: <span id="fps">60</span></div>
    </div>
    <div id="instructions">
      WASD - Move<br>
      Mouse - Place/Break<br>
      Space - Jump<br>
      1-5 - Select Block
    </div>
    <div id="blockSelector"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game constants
    const BLOCK_SIZE = 40;
    const GRAVITY = 0.5;
    const PLAYER_SPEED = 5;
    const JUMP_FORCE = -12;
    
    // Block types
    const BLOCKS = [
      { color: '#8B4513', name: 'Dirt' },
      { color: '#228B22', name: 'Grass' },
      { color: '#808080', name: 'Stone' },
      { color: '#8B0000', name: 'Brick' },
      { color: '#FFD700', name: 'Gold' }
    ];
    
    // Game state
    let selectedBlock = 0;
    let blocks = [];
    let camera = { x: 0, y: 0 };
    
    // Player
    const player = {
      x: 400,
      y: 300,
      width: 30,
      height: 50,
      vx: 0,
      vy: 0,
      grounded: false
    };
    
    // Input
    const keys = {};
    const mouse = { x: 0, y: 0, leftDown: false, rightDown: false };
    
    // Generate terrain
    function generateTerrain() {
      const groundLevel = 400;
      for (let x = 0; x < 2000; x += BLOCK_SIZE) {
        const height = groundLevel + Math.sin(x * 0.01) * 50;
        for (let y = height; y < 600; y += BLOCK_SIZE) {
          const blockType = y < height + BLOCK_SIZE ? 1 : (y < height + BLOCK_SIZE * 3 ? 0 : 2);
          blocks.push({
            x: x,
            y: y,
            type: blockType,
            width: BLOCK_SIZE,
            height: BLOCK_SIZE
          });
        }
      }
    }
    
    // Create block selector UI
    function createBlockSelector() {
      const selector = document.getElementById('blockSelector');
      BLOCKS.forEach((block, index) => {
        const option = document.createElement('div');
        option.className = 'block-option' + (index === 0 ? ' selected' : '');
        option.style.background = block.color;
        option.onclick = () => selectBlock(index);
        option.title = block.name;
        selector.appendChild(option);
      });
    }
    
    function selectBlock(index) {
      selectedBlock = index;
      document.querySelectorAll('.block-option').forEach((el, i) => {
        el.classList.toggle('selected', i === index);
      });
    }
    
    // Collision detection
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }
    
    // Update game
    function update() {
      // Player movement
      if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -PLAYER_SPEED;
      else if (keys['KeyD'] || keys['ArrowRight']) player.vx = PLAYER_SPEED;
      else player.vx = 0;
      
      // Jump
      if ((keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
      }
      
      // Apply gravity
      player.vy += GRAVITY;
      
      // Move player
      player.x += player.vx;
      player.y += player.vy;
      
      // Collision with blocks
      player.grounded = false;
      for (const block of blocks) {
        if (checkCollision(player, block)) {
          // Simple collision response
          if (player.vy > 0 && player.y + player.height - player.vy <= block.y) {
            player.y = block.y - player.height;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0 && player.y - player.vy >= block.y + block.height) {
            player.y = block.y + block.height;
            player.vy = 0;
          }
        }
      }
      
      // Boundaries
      if (player.x < 0) player.x = 0;
      if (player.x > 2000 - player.width) player.x = 2000 - player.width;
      if (player.y > 600 - player.height) {
        player.y = 600 - player.height;
        player.vy = 0;
        player.grounded = true;
      }
      
      // Camera follow
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;
      
      // Update UI
      document.getElementById('blockCount').textContent = blocks.length;
    }
    
    // Render game
    function render() {
      // Clear screen
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.save();
      ctx.translate(-camera.x, -camera.y);
      
      // Draw blocks
      for (const block of blocks) {
        if (block.x + block.width > camera.x && block.x < camera.x + canvas.width &&
            block.y + block.height > camera.y && block.y < camera.y + canvas.height) {
          ctx.fillStyle = BLOCKS[block.type].color;
          ctx.fillRect(block.x, block.y, block.width, block.height);
          
          // Block border
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.lineWidth = 2;
          ctx.strokeRect(block.x, block.y, block.width, block.height);
        }
      }
      
      // Draw player
      ctx.fillStyle = '#FF6B6B';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      
      // Player face
      ctx.fillStyle = 'white';
      ctx.fillRect(player.x + 5, player.y + 10, 8, 8);
      ctx.fillRect(player.x + 17, player.y + 10, 8, 8);
      ctx.fillStyle = 'black';
      ctx.fillRect(player.x + 7, player.y + 12, 4, 4);
      ctx.fillRect(player.x + 19, player.y + 12, 4, 4);
      
      // Draw placement preview
      const worldMouseX = mouse.x + camera.x;
      const worldMouseY = mouse.y + camera.y;
      const gridX = Math.floor(worldMouseX / BLOCK_SIZE) * BLOCK_SIZE;
      const gridY = Math.floor(worldMouseY / BLOCK_SIZE) * BLOCK_SIZE;
      
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.strokeRect(gridX, gridY, BLOCK_SIZE, BLOCK_SIZE);
      
      ctx.restore();
    }
    
    // Game loop
    let lastTime = 0;
    let frameCount = 0;
    let fpsTime = 0;
    
    function gameLoop(timestamp) {
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;
      
      // FPS counter
      frameCount++;
      fpsTime += deltaTime;
      if (fpsTime >= 1000) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        fpsTime = 0;
      }
      
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    
    // Event listeners
    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Block selection with number keys
      if (e.key >= '1' && e.key <= '5') {
        selectBlock(parseInt(e.key) - 1);
      }
    });
    
    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });
    
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const worldMouseX = e.clientX - rect.left + camera.x;
      const worldMouseY = e.clientY - rect.top + camera.y;
      const gridX = Math.floor(worldMouseX / BLOCK_SIZE) * BLOCK_SIZE;
      const gridY = Math.floor(worldMouseY / BLOCK_SIZE) * BLOCK_SIZE;
      
      if (e.button === 0) { // Left click - place block
        // Check if not colliding with player
        const newBlock = {
          x: gridX,
          y: gridY,
          type: selectedBlock,
          width: BLOCK_SIZE,
          height: BLOCK_SIZE
        };
        
        if (!checkCollision(player, newBlock)) {
          blocks.push(newBlock);
        }
      } else if (e.button === 2) { // Right click - remove block
        blocks = blocks.filter(b => 
          !(Math.abs(b.x - gridX) < 1 && Math.abs(b.y - gridY) < 1)
        );
      }
    });
    
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // Initialize
    generateTerrain();
    createBlockSelector();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
