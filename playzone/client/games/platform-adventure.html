<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #gameContainer {
      position: relative;
      width: 800px;
      height: 600px;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
    }
    #level-info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
      <div>Coins: <span id="coins">0</span>/<span id="totalCoins">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
    </div>
    <div id="level-info">
      Level: <span id="level">1</span><br>
      Press R to Restart
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const SPEED = 6;
    
    let currentLevel = 1;
    let coins = 0;
    let lives = 3;
    let gameWon = false;
    
    const player = {
      x: 50, y: 400, width: 40, height: 50,
      vx: 0, vy: 0, grounded: false, facing: 1
    };
    
    const keys = {};
    
    // Level designs
    const levels = [
      { // Level 1
        platforms: [
          {x: 0, y: 550, w: 800, h: 50},
          {x: 200, y: 450, w: 150, h: 20},
          {x: 400, y: 380, w: 150, h: 20},
          {x: 600, y: 300, w: 150, h: 20},
          {x: 100, y: 250, w: 200, h: 20}
        ],
        coins: [{x: 250, y: 410}, {x: 450, y: 340}, {x: 650, y: 260}, {x: 180, y: 210}],
        enemies: [{x: 400, y: 520, w: 40, h: 30, vx: 2, minX: 300, maxX: 600}],
        goal: {x: 720, y: 250, w: 50, h: 50}
      },
      { // Level 2
        platforms: [
          {x: 0, y: 550, w: 300, h: 50},
          {x: 400, y: 550, w: 400, h: 50},
          {x: 150, y: 450, w: 100, h: 20},
          {x: 350, y: 380, w: 100, h: 20},
          {x: 550, y: 300, w: 100, h: 20},
          {x: 300, y: 220, w: 200, h: 20}
        ],
        coins: [{x: 180, y: 410}, {x: 380, y: 340}, {x: 580, y: 260}, {x: 380, y: 180}],
        enemies: [
          {x: 450, y: 520, w: 40, h: 30, vx: 2, minX: 400, maxX: 700},
          {x: 320, y: 190, w: 40, h: 30, vx: 1.5, minX: 300, maxX: 480}
        ],
        goal: {x: 380, y: 170, w: 50, h: 50}
      }
    ];
    
    let platforms, levelCoins, enemies, goal;
    
    function loadLevel(level) {
      const data = levels[(level - 1) % levels.length];
      platforms = data.platforms;
      levelCoins = data.coins.map(c => ({...c, collected: false, w: 25, h: 25}));
      enemies = data.enemies.map(e => ({...e}));
      goal = {...data.goal};
      player.x = 50;
      player.y = 400;
      player.vx = 0;
      player.vy = 0;
      document.getElementById('totalCoins').textContent = levelCoins.length;
    }
    
    function checkCollision(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.width > r2.x &&
             r1.y < r2.y + r2.h && r1.y + r1.height > r2.y;
    }
    
    function update() {
      if (gameWon) return;
      
      // Input
      if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -SPEED; player.facing = -1; }
      else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = SPEED; player.facing = 1; }
      else player.vx = 0;
      
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
      }
      
      // Physics
      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;
      
      // Platform collision
      player.grounded = false;
      for (const p of platforms) {
        if (checkCollision(player, p)) {
          if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
          }
        }
      }
      
      // Boundaries
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
      if (player.y > canvas.height) {
        lives--;
        document.getElementById('lives').textContent = lives;
        if (lives <= 0) resetGame();
        else loadLevel(currentLevel);
      }
      
      // Collect coins
      for (const coin of levelCoins) {
        if (!coin.collected && checkCollision(player, coin)) {
          coin.collected = true;
          coins++;
          document.getElementById('coins').textContent = coins;
        }
      }
      
      // Enemy collision
      for (const enemy of enemies) {
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) enemy.vx *= -1;
        
        if (checkCollision(player, enemy)) {
          if (player.vy > 0 && player.y + player.height < enemy.y + enemy.h / 2) {
            enemy.x = -999; // Defeated
            player.vy = JUMP_FORCE / 2;
          } else {
            lives--;
            document.getElementById('lives').textContent = lives;
            if (lives <= 0) resetGame();
            else loadLevel(currentLevel);
          }
        }
      }
      
      // Goal
      if (checkCollision(player, goal)) {
        if (currentLevel < levels.length) {
          currentLevel++;
          document.getElementById('level').textContent = currentLevel;
          loadLevel(currentLevel);
        } else {
          gameWon = true;
        }
      }
    }
    
    function render() {
      // Sky
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Platforms
      for (const p of platforms) {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#228B22';
        ctx.fillRect(p.x, p.y, p.w, 10);
      }
      
      // Coins
      for (const coin of levelCoins) {
        if (!coin.collected) {
          ctx.fillStyle = '#FFD700';
          ctx.beginPath();
          ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#FFA500';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
      
      // Enemies
      for (const enemy of enemies) {
        ctx.fillStyle = '#DC143C';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        // Eyes
        ctx.fillStyle = 'white';
        ctx.fillRect(enemy.x + 5, enemy.y + 8, 10, 10);
        ctx.fillRect(enemy.x + 25, enemy.y + 8, 10, 10);
      }
      
      // Goal
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.fillStyle = '#FFF';
      ctx.font = '30px Arial';
      ctx.fillText('🚩', goal.x + 5, goal.y + 35);
      
      // Player
      ctx.fillStyle = '#FF6B6B';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Face
      ctx.fillStyle = 'white';
      const eyeOffset = player.facing === 1 ? 20 : 5;
      ctx.fillRect(player.x + eyeOffset, player.y + 12, 12, 12);
      ctx.fillStyle = 'black';
      ctx.fillRect(player.x + eyeOffset + 3, player.y + 15, 6, 6);
      
      // Win screen
      if (gameWon) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 YOU WIN! 🎉', canvas.width/2, canvas.height/2);
        ctx.font = '24px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText(`Coins: ${coins}`, canvas.width/2, canvas.height/2 + 50);
      }
    }
    
    function resetGame() {
      currentLevel = 1;
      coins = 0;
      lives = 3;
      gameWon = false;
      document.getElementById('level').textContent = 1;
      document.getElementById('coins').textContent = 0;
      document.getElementById('lives').textContent = 3;
      loadLevel(1);
    }
    
    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.key === 'r' || e.key === 'R') resetGame();
    });
    document.addEventListener('keyup', e => keys[e.code] = false);
    
    loadLevel(1);
    gameLoop();
  </script>
</body>
</html>
